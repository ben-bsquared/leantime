services:
  leantime-db:
    image: mysql:8.4
    volumes:
      - db_data:/var/lib/mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?MYSQL_ROOT_PASSWORD is required}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-leantime}
      MYSQL_USER: ${MYSQL_USER:-leantime}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?MYSQL_PASSWORD is required}
    networks:
      - leantime-net
    command: --character-set-server=UTF8MB4 --collation-server=UTF8MB4_unicode_ci
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -u$$MYSQL_USER -p$$MYSQL_PASSWORD || exit 1"]
      interval: 30s
      timeout: 10s
      start_period: 60s
      retries: 5

  leantime:
    image: leantime/leantime:${LEAN_VERSION:-latest}
    restart: unless-stopped
    environment:
      LEAN_APP_URL: ${LEAN_APP_URL:-}
      LEAN_APP_DIR: ${LEAN_APP_DIR:-}
      LEAN_DB_HOST: ${LEAN_DB_HOST:-leantime-db}
      LEAN_DB_PORT: ${LEAN_DB_PORT:-3306}
      LEAN_DB_DATABASE: ${LEAN_DB_DATABASE:-leantime}
      LEAN_DB_USER: ${LEAN_DB_USER:-leantime}
      LEAN_DB_PASSWORD: ${LEAN_DB_PASSWORD:?LEAN_DB_PASSWORD is required}
      LEAN_EMAIL_RETURN: ${LEAN_EMAIL_RETURN:?LEAN_EMAIL_RETURN is required}
      LEAN_SESSION_PASSWORD: ${LEAN_SESSION_PASSWORD:?LEAN_SESSION_PASSWORD is required}
      LEAN_LOG_CHANNELS: ${LEAN_LOG_CHANNELS:-stderr}
    security_opt:
      - no-new-privileges:true
    cap_add:
      - CAP_CHOWN
      - CAP_SETGID
      - CAP_SETUID
    ports:
      - "${LEAN_PORT:-8080}:8080"
    networks:
      - leantime-net
    volumes:
      - public_userfiles:/var/www/html/public/userfiles     # Volume to store public files, logo etc
      - userfiles:/var/www/html/userfiles                   # Original volume name for compatibility
      - plugins:/var/www/html/app/Plugins                   # Plugin storage
      - logs:/var/www/html/storage/logs                     # Log storage
    depends_on:
      leantime-db:
        condition: service_healthy

volumes:
  db_data:
  userfiles:
  public_userfiles:
  plugins:
  logs:

networks:
  leantime-net:
